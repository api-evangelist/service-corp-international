description: >-
  Service Corporation International (NYSE: SCI), headquartered in Houston, Texas, is North
  America's leading provider of deathcare products and services, owning and operating funeral
  homes and cemeteries across the United States and Canada. SCI markets its network under the
  Dignity Memorial brand, alongside Neptune Society and National Cremation, and sells funeral
  and cemetery services on both an at-need and a preneed basis. It publishes no developer
  program, no API documentation and no machine-readable API contract.
